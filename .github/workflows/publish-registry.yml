name: Publish registry
on:
  push:
    branches: [main]
    paths:
      - themes/**
      - packages/**
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run gen
      - name: Build registry
        env:
          RECLAIM_REGISTRY_HOME: https://afduarte.github.io/reclaim-ui
        run: node packages/registry/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/registry/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
